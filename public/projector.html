<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SAMAGRA CONNECT • Projector</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #050608;
            color: #ffffff;
            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
        }

        .projector-shell {
            width: 100vw;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .projector-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 24px;

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.015)
                );

            box-shadow:
                0 20px 70px rgba(0,0,0,0.35);

            backdrop-filter: blur(18px);
        }

        .projector-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .projector-logo {
            width: 48px;
            height: 48px;

            display: grid;
            place-items: center;

            border-radius: 15px;

            background: #ffffff;
            color: #050608;

            font-size: 24px;
            font-weight: 900;
        }

        .projector-title {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.14em;
        }

        .projector-subtitle {
            margin-top: 3px;

            font-size: 11px;
            letter-spacing: 0.3em;

            color: rgba(255,255,255,0.45);
        }

        .projector-live {
            display: flex;
            align-items: center;
            gap: 9px;

            padding: 10px 15px;

            border-radius: 999px;

            border: 1px solid rgba(255,255,255,0.08);

            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
        }

        .live-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #35ff8b;

            box-shadow:
                0 0 14px rgba(53,255,139,0.8);

            animation: livePulse 1.2s infinite;
        }

        @keyframes livePulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .projector-main {
            flex: 1;

            display: flex;
            flex-direction: column;

            padding-top: 22px;
        }

        .round-label {
            text-align: center;

            color: rgba(255,255,255,0.45);

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 0.25em;
        }

        .projector-question {
            margin-top: 8px;

            text-align: center;

            font-size: clamp(
                25px,
                4vw,
                52px
            );

            font-weight: 950;

            letter-spacing: 0.05em;
        }

        /* =====================================================
           IMAGE AREA
        ===================================================== */

        .image-stage {
            position: relative;

            width: min(
                76vw,
                900px
            );

            height: min(
                58vh,
                590px
            );

            margin: 22px auto 0;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border-radius: 30px;

            border: 1px solid rgba(255,255,255,0.09);

            background:
                radial-gradient(
                    circle at center,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.01) 65%
                );

            box-shadow:
                0 30px 100px rgba(0,0,0,0.55);
        }

        .image-stage::before {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    120deg,
                    transparent,
                    rgba(255,255,255,0.035),
                    transparent
                );
        }

        .logo-image {
            position: relative;

            max-width: 82%;
            max-height: 82%;

            object-fit: contain;

            border-radius: 18px;

            opacity: 1;

            transition:
                filter 0.35s ease,
                transform 0.35s ease,
                opacity 0.25s ease;

            filter: blur(12px);

            transform: scale(1.01);

            user-select: none;

            -webkit-user-drag: none;
        }

        .logo-image.visible {
            opacity: 1;
        }

        .hidden {
            display: none !important;
        }

        .projector-waiting {
            text-align: center;
        }

        .waiting-big {
            font-size: clamp(
                38px,
                7vw,
                80px
            );

            font-weight: 950;

            letter-spacing: 0.05em;
        }

        .waiting-small {
            margin-top: 10px;

            color: rgba(255,255,255,0.4);

            font-size: 15px;
        }

        /* =====================================================
           HUD
        ===================================================== */

        .projector-hud {
            width: min(
                100%,
                1000px
            );

            margin: 18px auto 0;

            display: grid;

            grid-template-columns:
                1fr
                1.5fr
                1fr;

            gap: 14px;
        }

        .hud-card {
            min-height: 80px;

            padding: 14px 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            border-radius: 18px;

            border: 1px solid rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.025);
        }

        .hud-label {
            font-size: 10px;

            color: rgba(255,255,255,0.4);

            letter-spacing: 0.2em;

            font-weight: 800;
        }

        .hud-value {
            margin-top: 5px;

            font-size: 20px;

            font-weight: 900;
        }

        .projector-timer {
            margin-top: 2px;

            font-size: 38px;

            line-height: 1;

            font-weight: 950;

            font-variant-numeric:
                tabular-nums;

            transition:
                transform 0.15s ease;
        }

        .projector-timer.urgent {
            transform: scale(1.1);

            color: #ff5757;

            text-shadow:
                0 0 20px rgba(255,87,87,0.65);
        }

        /* =====================================================
           ANSWER
        ===================================================== */

        .answer-reveal {
            width: min(
                850px,
                90vw
            );

            margin: 18px auto 0;

            padding: 18px 24px;

            text-align: center;

            border-radius: 20px;

            border: 1px solid rgba(255,255,255,0.1);

            background:
                rgba(255,255,255,0.05);
        }

        .reveal-label {
            font-size: 10px;

            color: rgba(255,255,255,0.45);

            letter-spacing: 0.25em;

            font-weight: 800;
        }

        .reveal-answer {
            margin-top: 6px;

            font-size: clamp(
                25px,
                4vw,
                45px
            );

            font-weight: 950;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            body {
                overflow: auto;
            }

            .projector-shell {
                padding: 12px;
            }

            .projector-header {
                padding: 14px;
            }

            .projector-title {
                font-size: 16px;
            }

            .projector-subtitle {
                font-size: 9px;
            }

            .image-stage {
                width: 100%;
                height: 48vh;
            }

            .projector-hud {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

<div class="projector-shell">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="projector-header">

        <div class="projector-brand">

            <div class="projector-logo">
                S
            </div>

            <div>

                <div class="projector-title">
                    SAMAGRA
                </div>

                <div class="projector-subtitle">
                    CONNECT
                </div>

            </div>

        </div>

        <div class="projector-live">

            <span class="live-dot"></span>

            LIVE

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="projector-main">

        <div class="round-label">
            LOGO CHALLENGE
        </div>

        <div
            id="questionNumber"
            class="projector-question"
        >
            WAITING
        </div>


        <!-- IMAGE -->

        <div
            id="imageStage"
            class="image-stage"
        >

            <div
                id="waitingMessage"
                class="projector-waiting"
            >

                <div class="waiting-big">
                    READY?
                </div>

                <div class="waiting-small">
                    Waiting for the host to start.
                </div>

            </div>


            <img
                id="logoImage"
                class="logo-image hidden"
                src=""
                alt="Logo clue"
            >

        </div>


        <!-- HUD -->

        <div class="projector-hud">

            <div class="hud-card">

                <div class="hud-label">
                    TIME
                </div>

                <div
                    id="timer"
                    class="projector-timer"
                >
                    30
                </div>

            </div>


            <div class="hud-card">

                <div class="hud-label">
                    CLUE
                </div>

                <div
                    id="clarityText"
                    class="hud-value"
                >
                    WAITING
                </div>

            </div>


            <div class="hud-card">

                <div class="hud-label">
                    TEAMS
                </div>

                <div
                    id="teamCount"
                    class="hud-value"
                >
                    0
                </div>

            </div>

        </div>


        <!-- ANSWER -->

        <div
            id="answerReveal"
            class="answer-reveal hidden"
        >

            <div class="reveal-label">
                ANSWER
            </div>

            <div
                id="answerText"
                class="reveal-answer"
            >
                —
            </div>

        </div>

    </main>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const logoImage =
    document.getElementById(
        "logoImage"
    );

const waitingMessage =
    document.getElementById(
        "waitingMessage"
    );

const questionNumber =
    document.getElementById(
        "questionNumber"
    );

const timer =
    document.getElementById(
        "timer"
    );

const clarityText =
    document.getElementById(
        "clarityText"
    );

const teamCount =
    document.getElementById(
        "teamCount"
    );

const answerReveal =
    document.getElementById(
        "answerReveal"
    );

const answerText =
    document.getElementById(
        "answerText"
    );


/* =========================================================
   STATE
========================================================= */

let lastQuestion = -1;
let lastImage = "";


/* =========================================================
   CALCULATE BLUR
=========================================================

   30 sec  = 12px
   20 sec  = 9px
   15 sec  = 6px
   10 sec  = 3px
   5 sec   = 1px
   0 sec   = 0px

   This is deliberately much clearer than the old
   18px starting blur.
========================================================= */

function calculateBlur(
    remainingMs
) {

    const remaining =
        Math.max(
            0,
            Math.min(
                30000,
                remainingMs
            )
        );

    const seconds =
        remaining / 1000;

    const blur =
        Math.max(
            0,
            Math.min(
                12,
                seconds * 0.4
            )
        );

    return blur;
}


/* =========================================================
   UPDATE IMAGE
========================================================= */

function updateImage(
    images,
    revealed
) {

    if (
        !Array.isArray(images) ||
        images.length === 0
    ) {

        logoImage.classList.add(
            "hidden"
        );

        waitingMessage.classList.remove(
            "hidden"
        );

        lastImage = "";

        return;

    }


    /*
       Current game uses question.images.

       We show the FIRST image as the
       current logo clue.
    */

    const image =
        images[0];


    if (
        image !== lastImage
    ) {

        lastImage =
            image;

        logoImage.src =
            image;

        logoImage.classList.remove(
            "hidden"
        );

        waitingMessage.classList.add(
            "hidden"
        );

        /*
           Force browser to reveal that
           the image actually loaded.
        */

        logoImage.onload =
            () => {

                logoImage.style.opacity =
                    "1";

            };

        logoImage.onerror =
            () => {

                clarityText.textContent =
                    "IMAGE ERROR";

            };

    }


    if (revealed) {

        logoImage.style.filter =
            "blur(0px)";

        logoImage.style.transform =
            "scale(1)";

        return;

    }

}


/* =========================================================
   UPDATE GAME
========================================================= */

async function updateGame() {

    try {

        const response =
            await fetch(
                "/api/state",
                {
                    cache:
                        "no-store"
                }
            );

        if (
            !response.ok
        ) {

            throw new Error(
                "State request failed"
            );

        }


        const state =
            await response.json();


        /* =================================================
           WAITING
        ================================================= */

        if (
            !state.started
        ) {

            questionNumber.textContent =
                "WAITING";

            timer.textContent =
                "30";

            clarityText.textContent =
                "WAITING";

            logoImage.classList.add(
                "hidden"
            );

            waitingMessage.classList.remove(
                "hidden"
            );

            answerReveal.classList.add(
                "hidden"
            );

            lastQuestion = -1;
            lastImage = "";

            return;

        }


        /* =================================================
           QUESTION
        ================================================= */

        const currentQuestion =
            state.question;


        questionNumber.textContent =
            String(
                currentQuestion
            ).padStart(
                2,
                "0"
            ) +
            " / " +
            String(
                state.totalQuestions
            ).padStart(
                2,
                "0"
            );


        /* =================================================
           TIMER
        ================================================= */

        const remaining =
            Math.max(
                0,
                state.remaining
            );

        const seconds =
            Math.ceil(
                remaining / 1000
            );

        timer.textContent =
            seconds;


        /* =================================================
           TEAM COUNT
        ================================================= */

        if (
            Array.isArray(
                state.leaderboard
            )
        ) {

            teamCount.textContent =
                state.leaderboard.length;

        }


        /* =================================================
           NEW QUESTION
        ================================================= */

        if (
            lastQuestion !==
            currentQuestion
        ) {

            lastQuestion =
                currentQuestion;

            lastImage = "";

            answerReveal.classList.add(
                "hidden"
            );

            clarityText.textContent =
                "STARTING";

        }


        /* =================================================
           IMAGE
        ================================================= */

        updateImage(
            state.images,
            state.revealed
        );


        /* =================================================
           REVEALED
        ================================================= */

        if (
            state.revealed
        ) {

            logoImage.style.filter =
                "blur(0px)";

            logoImage.style.transform =
                "scale(1)";

            clarityText.textContent =
                "ANSWER REVEALED";

            answerText.textContent =
                state.answer ||
                "—";

            answerReveal.classList.remove(
                "hidden"
            );

        }

        else {

            answerReveal.classList.add(
                "hidden"
            );


            const blur =
                calculateBlur(
                    remaining
                );


            logoImage.style.filter =
                `blur(${blur}px)`;


            logoImage.style.transform =
                "scale(1.01)";


            if (
                seconds > 20
            ) {

                clarityText.textContent =
                    "BLURRED";

            }

            else if (
                seconds > 10
            ) {

                clarityText.textContent =
                    "GETTING CLEARER";

            }

            else if (
                seconds > 5
            ) {

                clarityText.textContent =
                    "CLEARING";

            }

            else if (
                seconds > 0
            ) {

                clarityText.textContent =
                    "ALMOST CLEAR";

            }

            else {

                clarityText.textContent =
                    "TIME UP";

            }

        }


        /* =================================================
           URGENT TIMER
        ================================================= */

        if (
            seconds <= 5 &&
            seconds > 0
        ) {

            timer.classList.add(
                "urgent"
            );

        }

        else {

            timer.classList.remove(
                "urgent"
            );

        }


    }

    catch (
        error
    ) {

        console.error(
            "Projector state error:",
            error
        );

        clarityText.textContent =
            "CONNECTING...";

    }

}


/* =========================================================
   START POLLING
========================================================= */

updateGame();

setInterval(
    updateGame,
    250
);

</script>

</body>
</html>
