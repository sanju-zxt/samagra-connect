<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Samagra Connect • Projector</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>

<body class="projector-page">

<div class="projector-shell">

    <!-- TOP BAR -->

    <header class="projector-header">

        <div class="projector-brand">

            <div class="projector-logo">
                S
            </div>

            <div>
                <div class="projector-title">
                    SAMAGRA
                </div>

                <div class="projector-subtitle">
                    CONNECT
                </div>
            </div>

        </div>


        <div class="projector-live">

            <span class="live-dot"></span>

            LIVE

        </div>

    </header>


    <!-- MAIN -->

    <main class="projector-main">

        <div class="round-label">
            LOGO CHALLENGE
        </div>


        <div
            id="questionNumber"
            class="projector-question"
        >
            WAITING
        </div>


        <!-- IMAGE -->

        <div
            id="imageStage"
            class="image-stage"
        >

            <div
                id="waitingMessage"
                class="projector-waiting"
            >

                <div class="waiting-big">
                    READY?
                </div>

                <div class="waiting-small">
                    Waiting for the host to start.
                </div>

            </div>


            <img
                id="logoImage"
                class="logo-image hidden"
                src=""
                alt="Logo clue"
            />

        </div>


        <!-- BOTTOM HUD -->

        <div class="projector-hud">

            <div class="hud-card">

                <div class="hud-label">
                    TIME
                </div>

                <div
                    id="timer"
                    class="projector-timer"
                >
                    30
                </div>

            </div>


            <div class="hud-card center">

                <div class="hud-label">
                    CLUE
                </div>

                <div
                    id="clarityText"
                    class="hud-value"
                >
                    STARTING BLURRED
                </div>

            </div>


            <div class="hud-card">

                <div class="hud-label">
                    PLAYERS
                </div>

                <div
                    id="playerCount"
                    class="hud-value"
                >
                    0
                </div>

            </div>

        </div>


        <!-- REVEAL -->

        <div
            id="answerReveal"
            class="answer-reveal hidden"
        >

            <div class="reveal-label">
                ANSWER
            </div>

            <div
                id="answerText"
                class="reveal-answer"
            >
                —
            </div>

        </div>

    </main>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();


const logoImage =
    document.getElementById(
        "logoImage"
    );

const waitingMessage =
    document.getElementById(
        "waitingMessage"
    );

const questionNumber =
    document.getElementById(
        "questionNumber"
    );

const timer =
    document.getElementById(
        "timer"
    );

const clarityText =
    document.getElementById(
        "clarityText"
    );

const playerCount =
    document.getElementById(
        "playerCount"
    );

const answerReveal =
    document.getElementById(
        "answerReveal"
    );

const answerText =
    document.getElementById(
        "answerText"
    );


let currentImage = "";
let currentRound = -1;
let roundStart = null;
let roundEnd = null;


/* =========================================================
   GAME STATE
========================================================= */

socket.on(
    "game-state",
    state => {

        playerCount.textContent =
            state.players.length;


        if (
            !state.running ||
            !state.question
        ) {

            questionNumber.textContent =
                "WAITING";

            waitingMessage.classList.remove(
                "hidden"
            );

            logoImage.classList.add(
                "hidden"
            );

            answerReveal.classList.add(
                "hidden"
            );

            return;
        }


        waitingMessage.classList.add(
            "hidden"
        );

        logoImage.classList.remove(
            "hidden"
        );


        if (
            currentImage !==
            state.question.image
        ) {

            currentImage =
                state.question.image;

            logoImage.src =
                currentImage;

            currentRound =
                state.questionIndex;

            answerReveal.classList.add(
                "hidden"
            );

            /*
                Reset blur immediately.
            */

            logoImage.style.filter =
                "blur(18px)";

            logoImage.classList.remove(
                "clear-reveal"
            );
        }


        questionNumber.textContent =
            String(
                state.questionIndex + 1
            ).padStart(2, "0") +
            " / " +
            String(
                state.question.total
            ).padStart(2, "0");


        roundStart =
            state.roundStartedAt;

        roundEnd =
            state.roundEndsAt;


        if (state.revealed) {

            logoImage.style.filter =
                "blur(0px)";

            clarityText.textContent =
                "ANSWER REVEALED";

        }

    }
);


/* =========================================================
   TIMER
========================================================= */

socket.on(
    "timer",
    data => {

        const remaining =
            Math.max(
                0,
                data.remaining
            );

        timer.textContent =
            Math.ceil(
                remaining
            );


        /*
            BLUR LOGIC

            30 sec:
                18px blur

            15 sec:
                around 8px blur

            0 sec:
                0px blur
        */

        const progress =
            Math.min(
                1,
                Math.max(
                    0,
                    (30 - remaining) / 30
                )
            );


        let blur;


        if (remaining > 15) {

            /*
                First half:
                18px -> 8px
            */

            const firstHalf =
                (30 - remaining) / 15;

            blur =
                18 -
                (firstHalf * 10);

            clarityText.textContent =
                "HEAVILY BLURRED";

        } else {

            /*
                Second half:
                8px -> 0px
            */

            const secondHalf =
                (15 - remaining) / 15;

            blur =
                8 -
                (secondHalf * 8);

            if (remaining > 7) {

                clarityText.textContent =
                    "GETTING CLEARER";

            } else if (remaining > 0) {

                clarityText.textContent =
                    "ALMOST CLEAR";

            } else {

                clarityText.textContent =
                    "FULLY CLEAR";
            }

        }


        logoImage.style.filter =
            `blur(${Math.max(0, blur)}px)`;


        if (remaining <= 5) {

            timer.classList.add(
                "urgent"
            );

        } else {

            timer.classList.remove(
                "urgent"
            );

        }

    }
);


/* =========================================================
   NEW QUESTION
========================================================= */

socket.on(
    "new-question",
    data => {

        currentImage =
            data.question.image;

        logoImage.src =
            currentImage;

        logoImage.classList.remove(
            "hidden"
        );

        waitingMessage.classList.add(
            "hidden"
        );

        answerReveal.classList.add(
            "hidden"
        );

        logoImage.style.filter =
            "blur(18px)";

        clarityText.textContent =
            "STARTING BLURRED";

    }
);


/* =========================================================
   ANSWER REVEAL
========================================================= */

socket.on(
    "answer-revealed",
    data => {

        logoImage.style.filter =
            "blur(0px)";

        clarityText.textContent =
            "ANSWER REVEALED";

        answerText.textContent =
            data.answer;

        answerReveal.classList.remove(
            "hidden"
        );

    }
);


/* =========================================================
   GAME FINISHED
========================================================= */

socket.on(
    "game-finished",
    () => {

        logoImage.style.filter =
            "blur(0px)";

        clarityText.textContent =
            "GAME COMPLETE";

    }
);


/* =========================================================
   RESET
========================================================= */

socket.on(
    "game-reset",
    () => {

        currentImage = "";
        currentRound = -1;

        logoImage.classList.add(
            "hidden"
        );

        waitingMessage.classList.remove(
            "hidden"
        );

        answerReveal.classList.add(
            "hidden"
        );

        questionNumber.textContent =
            "WAITING";

        timer.textContent =
            "30";

    }
);

</script>

</body>
</html>
