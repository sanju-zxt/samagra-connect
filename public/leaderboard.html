<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Samagra Connect • Leaderboard</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body class="leaderboard-page">

<div class="leaderboard-shell">


    <header class="leaderboard-header">

        <div>

            <div class="eyebrow">
                SAMAGRA CONNECT
            </div>

            <h1>
                Leaderboard
            </h1>

        </div>


        <div class="live-indicator">

            <span></span>

            LIVE

        </div>

    </header>


    <main>

        <div
            id="leaderboard"
            class="big-leaderboard"
        >

            <div class="leaderboard-empty">
                Waiting for players...
            </div>

        </div>

    </main>


    <footer class="leaderboard-footer">
        INDIVIDUAL LOGO CHALLENGE • 10 POINTS MAX
    </footer>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const leaderboard =
    document.getElementById(
        "leaderboard"
    );


socket.on(
    "leaderboard",
    players => {

        if (!players.length) {

            leaderboard.innerHTML = `
                <div class="leaderboard-empty">
                    Waiting for players...
                </div>
            `;

            return;
        }


        leaderboard.innerHTML =
            players
                .map(
                    (player, index) => {

                        let medal = "";

                        if (index === 0) {
                            medal = "01";
                        } else if (index === 1) {
                            medal = "02";
                        } else if (index === 2) {
                            medal = "03";
                        } else {
                            medal =
                                String(
                                    index + 1
                                ).padStart(
                                    2,
                                    "0"
                                );
                        }


                        return `
                            <div class="
                                leaderboard-row
                                ${
                                    index < 3
                                        ? "top-three"
                                        : ""
                                }
                            ">

                                <div class="big-rank">
                                    ${medal}
                                </div>

                                <div class="big-player-name">
                                    ${escapeHtml(
                                        player.name
                                    )}
                                </div>

                                <div class="
                                    big-player-score
                                ">
                                    ${player.score}
                                </div>

                            </div>
                        `;
                    }
                )
                .join("");

    }
);


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
