<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050608"
    >

    <title>SAMAGRA • LIVE RANKINGS</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    #1b1e25 0%,
                    #0b0d11 38%,
                    #050608 78%
                );

            color: #fff;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            overflow-x: hidden;
        }


        /* =====================================================
           BACKGROUND
           ===================================================== */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.017) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.017) 1px,
                    transparent 1px
                );

            background-size: 70px 70px;

            opacity: .5;
        }


        /* =====================================================
           APP
           ===================================================== */

        .app {

            position: relative;
            z-index: 1;

            width:
                min(
                    1450px,
                    100%
                );

            min-height: 100vh;

            margin: auto;

            padding:
                32px
                35px
                45px;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding-bottom: 22px;

            border-bottom:
                1px solid
                rgba(255,255,255,.07);
        }

        .brand {

            color: #fff;

            font-size: 13px;

            font-weight: 900;

            letter-spacing: .25em;
        }

        .subtitle {

            margin-top: 7px;

            color: #59616d;

            font-size: 7px;

            font-weight: 900;

            letter-spacing: .2em;
        }

        .live {

            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                9px
                13px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 999px;

            background:
                rgba(255,255,255,.025);

            color: #68707d;

            font-size: 7px;

            font-weight: 900;

            letter-spacing: .14em;
        }

        .live-dot {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #67e49a;

            box-shadow:
                0 0 13px
                rgba(103,228,154,.7);
        }


        /* =====================================================
           HERO
           ===================================================== */

        .hero {

            padding:
                38px
                0
                25px;
        }

        .hero-kicker {

            color: #59616d;

            font-size: 8px;

            font-weight: 900;

            letter-spacing: .24em;
        }

        .hero-title {

            margin-top: 10px;

            color: #fff;

            font-size:
                clamp(
                    42px,
                    6vw,
                    78px
                );

            line-height: .9;

            font-weight: 900;

            letter-spacing: -.075em;
        }

        .hero-bottom {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-top: 18px;
        }

        .hero-text {

            color: #626a76;

            font-size: 10px;

            line-height: 1.6;
        }

        .round {

            padding:
                10px
                14px;

            border:
                1px solid
                rgba(255,255,255,.07);

            border-radius: 10px;

            color: #858d98;

            background:
                rgba(255,255,255,.025);

            font-size: 8px;

            font-weight: 900;

            letter-spacing: .12em;

            white-space: nowrap;
        }


        /* =====================================================
           TOP THREE
           ===================================================== */

        .podium {

            display: grid;

            grid-template-columns:
                1fr
                1.12fr
                1fr;

            align-items: end;

            gap: 13px;

            margin-top: 12px;
        }

        .podium-card {

            position: relative;

            min-height: 180px;

            padding:
                23px 20px;

            border:
                1px solid
                rgba(255,255,255,.07);

            border-radius: 19px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.012)
                );

            text-align: center;

            overflow: hidden;
        }

        .podium-card.first {

            min-height: 215px;

            border-color:
                rgba(255,255,255,.13);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.085),
                    rgba(255,255,255,.018)
                );

            box-shadow:
                0 25px 80px
                rgba(0,0,0,.3);
        }

        .podium-rank {

            color: #626a76;

            font-size: 7px;

            font-weight: 900;

            letter-spacing: .18em;
        }

        .first .podium-rank {
            color: #fff;
        }

        .podium-number {

            margin-top: 8px;

            color: #fff;

            font-size: 33px;

            line-height: 1;

            font-weight: 900;

            letter-spacing: -.06em;
        }

        .first .podium-number {

            font-size: 46px;
        }

        .podium-name {

            margin-top: 11px;

            color: #fff;

            font-size: 14px;

            font-weight: 900;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .podium-score {

            margin-top: 8px;

            color: #68707d;

            font-size: 9px;

            font-weight: 800;

            font-variant-numeric:
                tabular-nums;
        }

        .first .podium-score {
            color: #fff;
        }


        /* =====================================================
           TABLE CARD
           ===================================================== */

        .table-card {

            margin-top: 18px;

            padding:
                20px;

            border:
                1px solid
                rgba(255,255,255,.07);

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.04),
                    rgba(255,255,255,.012)
                );

            overflow: hidden;
        }

        .table-head {

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .table-title {

            color: #fff;

            font-size: 14px;

            font-weight: 900;
        }

        .team-count {

            color: #59616d;

            font-size: 7px;

            font-weight: 900;

            letter-spacing: .12em;
        }


        /* =====================================================
           TABLE
           ===================================================== */

        .table-scroll {

            width: 100%;

            overflow-x: auto;

            margin-top: 11px;
        }

        table {

            width: 100%;

            min-width: 760px;

            border-collapse:
                separate;

            border-spacing:
                0 6px;
        }

        th {

            padding:
                8px
                13px;

            color: #4e5662;

            font-size: 7px;

            font-weight: 900;

            letter-spacing: .15em;

            text-align: left;
        }

        th:first-child {
            width: 85px;
        }

        th:nth-child(3) {
            width: 170px;
        }

        th:nth-child(4) {
            width: 170px;
        }

        th:last-child {
            width: 150px;

            text-align: right;
        }

        td {

            height: 60px;

            padding:
                9px
                13px;

            background:
                rgba(255,255,255,.025);

            border-top:
                1px solid
                rgba(255,255,255,.035);

            border-bottom:
                1px solid
                rgba(255,255,255,.035);

            color: #aeb5bf;

            font-size: 10px;

            font-weight: 700;
        }

        td:first-child {

            border-radius:
                11px
                0
                0
                11px;
        }

        td:last-child {

            border-radius:
                0
                11px
                11px
                0;

            text-align: right;

            color: #fff;

            font-size: 15px;

            font-weight: 900;

            font-variant-numeric:
                tabular-nums;
        }

        tr.top-rank td {

            background:
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.08),
                    rgba(255,255,255,.025)
                );

            color: #fff;
        }


        /* =====================================================
           RANK
           ===================================================== */

        .rank-badge {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: 34px;
            height: 34px;

            border-radius: 10px;

            background:
                rgba(255,255,255,.04);

            color: #68707d;

            font-size: 9px;

            font-weight: 900;
        }

        .top-rank .rank-badge {

            background:
                rgba(255,255,255,.1);

            color: #fff;
        }


        /* =====================================================
           TEAM
           ===================================================== */

        .team-cell {

            display: flex;

            align-items: center;

            gap: 11px;

            min-width: 0;
        }

        .avatar {

            width: 35px;
            height: 35px;

            flex: 0 0 35px;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid
                rgba(255,255,255,.07);

            border-radius: 10px;

            background:
                rgba(255,255,255,.035);

            color: #fff;

            font-size: 9px;

            font-weight: 900;
        }

        .team-name {

            min-width: 0;

            color: #fff;

            font-size: 11px;

            font-weight: 900;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =====================================================
           STATUS
           ===================================================== */

        .submitted {

            color: #67e49a;

            font-size: 7px;

            font-weight: 900;

            letter-spacing: .1em;
        }

        .waiting {

            color: #555d69;

            font-size: 7px;

            font-weight: 900;

            letter-spacing: .1em;
        }

        .correct {

            color: #67e49a;

            font-size: 7px;

            font-weight: 900;

            letter-spacing: .1em;
        }

        .wrong {

            color: #ff6974;

            font-size: 7px;

            font-weight: 900;

            letter-spacing: .1em;
        }


        /* =====================================================
           EMPTY
           ===================================================== */

        .empty {

            padding:
                50px
                20px;

            color: #59616d;

            text-align: center;

            font-size: 10px;
        }


        /* =====================================================
           FINISHED
           ===================================================== */

        .final-message {

            display: none;

            margin-top: 20px;

            padding: 24px;

            border:
                1px solid
                rgba(103,228,154,.13);

            border-radius: 17px;

            background:
                rgba(103,228,154,.035);

            text-align: center;
        }

        .final-message.show {
            display: block;
        }

        .final-title {

            color: #67e49a;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: .18em;
        }

        .final-text {

            margin-top: 7px;

            color: #fff;

            font-size: 16px;

            font-weight: 900;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 800px) {

            .app {
                padding:
                    20px
                    14px
                    35px;
            }

            .podium {

                grid-template-columns:
                    1fr;

            }

            .podium-card,
            .podium-card.first {

                min-height: 145px;

            }

            .podium-card.first {

                order: -1;

            }

            .hero-title {

                font-size: 45px;

            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =================================================
         HEADER
         ================================================= -->

    <header class="header">

        <div>

            <div class="brand">
                SAMAGRA • CONNECT
            </div>

            <div class="subtitle">
                LIVE CHAMPIONSHIP RANKINGS
            </div>

        </div>


        <div class="live">

            <span class="live-dot"></span>

            LIVE

        </div>

    </header>


    <!-- =================================================
         HERO
         ================================================= -->

    <section class="hero">

        <div class="hero-kicker">
            CURRENT STANDINGS
        </div>

        <h1 class="hero-title">
            LEADERBOARD
        </h1>


        <div class="hero-bottom">

            <div class="hero-text">
                Scores update automatically as teams
                submit their answers.
            </div>

            <div
                id="round"
                class="round"
            >
                ROUND — / —
            </div>

        </div>

    </section>


    <!-- =================================================
         PODIUM
         ================================================= -->

    <section
        id="podium"
        class="podium"
    >

        <!-- generated by JS -->

    </section>


    <!-- =================================================
         TABLE
         ================================================= -->

    <section class="table-card">

        <div class="table-head">

            <div class="table-title">
                ALL TEAMS
            </div>

            <div
                id="teamCount"
                class="team-count"
            >
                0 TEAMS
            </div>

        </div>


        <div class="table-scroll">

            <table>

                <thead>

                    <tr>

                        <th>
                            RANK
                        </th>

                        <th>
                            TEAM
                        </th>

                        <th>
                            ANSWER
                        </th>

                        <th>
                            RESULT
                        </th>

                        <th>
                            SCORE
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="leaderboard"
                >

                    <tr>

                        <td
                            colspan="5"
                            class="empty"
                        >
                            Waiting for teams...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <!-- =================================================
         FINAL
         ================================================= -->

    <section
        id="finalMessage"
        class="final-message"
    >

        <div class="final-title">
            SAMAGRA • CONNECT
        </div>

        <div class="final-text">
            FINAL STANDINGS
        </div>

    </section>


</div>


<script>

"use strict";


/* =========================================================
   ELEMENTS
   ========================================================= */

const leaderboard =
    document.getElementById(
        "leaderboard"
    );

const podium =
    document.getElementById(
        "podium"
    );

const teamCount =
    document.getElementById(
        "teamCount"
    );

const round =
    document.getElementById(
        "round"
    );

const finalMessage =
    document.getElementById(
        "finalMessage"
    );


/* =========================================================
   STATE
   ========================================================= */

let state = null;


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   FETCH
   ========================================================= */

async function loadState() {

    try {

        const response =
            await fetch(
                "/api/state?_=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {
            return;
        }


        state =
            await response.json();


        render();

    }
    catch(error) {

        console.error(
            "Leaderboard error:",
            error
        );

    }

}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    if (!state) {
        return;
    }


    const teams =
        Array.isArray(
            state.leaderboard
        )
            ? state.leaderboard
            : [];


    /* ROUND */

    if (
        state.started
    ) {

        round.textContent =
            "ROUND " +
            String(
                state.question
            ).padStart(
                2,
                "0"
            ) +
            " / " +
            state.totalQuestions;

    }
    else {

        round.textContent =
            "WAITING TO START";

    }


    /* COUNT */

    teamCount.textContent =
        teams.length +
        (
            teams.length === 1
                ? " TEAM"
                : " TEAMS"
        );


    /* TABLE */

    renderTable(
        teams
    );


    /* PODIUM */

    renderPodium(
        teams
    );


    /* FINAL */

    if (
        state.finished
    ) {

        finalMessage.classList.add(
            "show"
        );

    }
    else {

        finalMessage.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   TABLE
   ========================================================= */

function renderTable(
    teams
) {

    if (
        teams.length === 0
    ) {

        leaderboard.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty"
                >
                    Waiting for teams to join...

                </td>

            </tr>

        `;

        return;

    }


    leaderboard.innerHTML =
        teams.map(
            (
                team,
                index
            ) => {

                const rank =
                    Number(
                        team.rank ||
                        index + 1
                    );


                const name =
                    team.name ||
                    "TEAM";


                const initial =
                    name
                        .charAt(0)
                        .toUpperCase();


                let answerText =
                    "WAITING";

                let answerClass =
                    "waiting";


                if (
                    team.submitted
                ) {

                    answerText =
                        "SUBMITTED";

                    answerClass =
                        "submitted";

                }


                let resultText =
                    "—";

                let resultClass =
                    "";


                if (
                    team.submitted
                ) {

                    if (
                        team.correct
                    ) {

                        resultText =
                            "CORRECT";

                        resultClass =
                            "correct";

                    }
                    else {

                        resultText =
                            "WRONG";

                        resultClass =
                            "wrong";

                    }

                }


                return `

                    <tr
                        class="${
                            rank <= 3
                                ? "top-rank"
                                : ""
                        }"
                    >

                        <td>

                            <span
                                class="rank-badge"
                            >
                                ${
                                    String(
                                        rank
                                    ).padStart(
                                        2,
                                        "0"
                                    )
                                }
                            </span>

                        </td>


                        <td>

                            <div
                                class="team-cell"
                            >

                                <div
                                    class="avatar"
                                >
                                    ${escapeHTML(
                                        initial
                                    )}
                                </div>

                                <div
                                    class="team-name"
                                >
                                    ${escapeHTML(
                                        name
                                    )}
                                </div>

                            </div>

                        </td>


                        <td>

                            <span
                                class="${
                                    answerClass
                                }"
                            >
                                ${
                                    answerText
                                }
                            </span>

                        </td>


                        <td>

                            <span
                                class="${
                                    resultClass
                                }"
                            >
                                ${
                                    resultText
                                }
                            </span>

                        </td>


                        <td>

                            ${
                                Number(
                                    team.score || 0
                                ).toFixed(2)
                            }

                        </td>

                    </tr>

                `;

            }
        )
        .join("");

}


/* =========================================================
   PODIUM
   ========================================================= */

function renderPodium(
    teams
) {

    if (
        teams.length === 0
    ) {

        podium.innerHTML =
            "";

        return;

    }


    const top =
        teams.slice(
            0,
            3
        );


    /*
     * For one or two teams, don't create
     * fake podium positions.
     */

    if (
        top.length === 1
    ) {

        podium.innerHTML = `

            <div></div>

            ${podiumCard(
                top[0],
                1,
                true
            )}

            <div></div>

        `;

        return;

    }


    if (
        top.length === 2
    ) {

        podium.innerHTML = `

            ${podiumCard(
                top[1],
                2,
                false
            )}

            ${podiumCard(
                top[0],
                1,
                true
            )}

            <div></div>

        `;

        return;

    }


    /*
     * Three teams.
     */

    podium.innerHTML = `

        ${podiumCard(
            top[1],
            2,
            false
        )}

        ${podiumCard(
            top[0],
            1,
            true
        )}

        ${podiumCard(
            top[2],
            3,
            false
        )}

    `;

}


/* =========================================================
   PODIUM CARD
   ========================================================= */

function podiumCard(
    team,
    rank,
    first
) {

    const name =
        team.name ||
        "TEAM";


    return `

        <div
            class="podium-card ${
                first
                    ? "first"
                    : ""
            }"
        >

            <div class="podium-rank">

                ${
                    rank === 1
                        ? "1ST PLACE"
                        : rank === 2
                            ? "2ND PLACE"
                            : "3RD PLACE"
                }

            </div>


            <div class="podium-number">

                #${rank}

            </div>


            <div class="podium-name">

                ${escapeHTML(
                    name
                )}

            </div>


            <div class="podium-score">

                ${
                    Number(
                        team.score || 0
                    ).toFixed(2)
                }
                POINTS

            </div>

        </div>

    `;

}


/* =========================================================
   START
   ========================================================= */

loadState();


/*
 * Live leaderboard update.
 */

setInterval(
    loadState,
    500
);

</script>

</body>
</html>
