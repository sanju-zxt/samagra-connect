<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SAMAGRA CONNECT • Team</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            min-height: 100%;

            background:
                radial-gradient(
                    circle at top,
                    #11141a 0%,
                    #050608 50%,
                    #020304 100%
                );

            color: white;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .page {
            width: 100%;
            min-height: 100vh;

            padding: 20px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shell {
            width: min(
                620px,
                100%
            );
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .brand {
            font-size: 20px;

            font-weight: 950;

            letter-spacing: 0.16em;
        }

        .status {
            padding: 9px 13px;

            border-radius: 999px;

            font-size: 11px;

            font-weight: 900;

            letter-spacing: 0.08em;

            border: 1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.04);
        }

        .status.open {
            border-color:
                rgba(53,255,139,0.3);

            color: #35ff8b;

            background:
                rgba(53,255,139,0.07);
        }

        .status.locked {
            border-color:
                rgba(255,87,87,0.3);

            color: #ff5757;

            background:
                rgba(255,87,87,0.07);
        }

        /* =====================================================
           CARD
        ===================================================== */

        .card {
            padding: 25px;

            border-radius: 26px;

            border: 1px solid
                rgba(255,255,255,0.08);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.06),
                    rgba(255,255,255,0.025)
                );

            box-shadow:
                0 30px 90px
                rgba(0,0,0,0.45);

            backdrop-filter:
                blur(20px);
        }

        h1,
        h2,
        p {
            margin-top: 0;
        }

        h1 {
            margin-bottom: 8px;

            font-size: 30px;

            font-weight: 950;
        }

        h2 {
            margin-bottom: 8px;

            font-size: 24px;

            font-weight: 950;
        }

        .muted {
            color:
                rgba(255,255,255,0.48);

            line-height: 1.6;

            font-size: 14px;
        }

        /* =====================================================
           INPUT
        ===================================================== */

        .input {
            width: 100%;

            margin-top: 12px;

            padding: 17px 18px;

            border-radius: 15px;

            border: 1px solid
                rgba(255,255,255,0.1);

            outline: none;

            background:
                rgba(0,0,0,0.35);

            color: white;

            font-size: 16px;

            transition:
                border 0.2s ease,
                box-shadow 0.2s ease;
        }

        .input::placeholder {
            color:
                rgba(255,255,255,0.3);
        }

        .input:focus {
            border-color:
                rgba(255,255,255,0.3);

            box-shadow:
                0 0 0 4px
                rgba(255,255,255,0.04);
        }

        .input:disabled {
            opacity: 0.45;

            cursor: not-allowed;
        }

        /* =====================================================
           BUTTON
        ===================================================== */

        .button {
            width: 100%;

            margin-top: 14px;

            padding: 17px;

            border: 0;

            border-radius: 15px;

            background: white;

            color: #050608;

            font-size: 14px;

            font-weight: 950;

            letter-spacing: 0.08em;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        .button:hover:not(:disabled) {
            transform:
                translateY(-2px);
        }

        .button:active:not(:disabled) {
            transform:
                translateY(0);
        }

        .button:disabled {
            opacity: 0.3;

            cursor: not-allowed;
        }

        /* =====================================================
           GAME
        ===================================================== */

        .game-top {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            margin-bottom: 20px;
        }

        .team-name {
            font-size: 20px;

            font-weight: 950;
        }

        .round {
            color:
                rgba(255,255,255,0.45);

            font-size: 12px;

            font-weight: 800;
        }

        /* =====================================================
           TIMER
        ===================================================== */

        .timer-box {
            text-align: center;

            padding: 22px;

            margin-bottom: 20px;

            border-radius: 22px;

            background:
                rgba(255,255,255,0.025);

            border: 1px solid
                rgba(255,255,255,0.07);
        }

        .timer-label {
            font-size: 10px;

            font-weight: 800;

            letter-spacing: 0.22em;

            color:
                rgba(255,255,255,0.4);
        }

        .timer {
            margin-top: 8px;

            font-size: 70px;

            line-height: 0.95;

            font-weight: 950;

            font-variant-numeric:
                tabular-nums;

            transition:
                transform 0.15s ease,
                color 0.15s ease;
        }

        .timer.urgent {
            color: #ff5757;

            transform: scale(1.05);

            text-shadow:
                0 0 25px
                rgba(255,87,87,0.6);
        }

        /* =====================================================
           RESULT
        ===================================================== */

        .result {
            margin-top: 16px;

            padding: 16px;

            border-radius: 15px;

            text-align: center;

            font-size: 14px;

            font-weight: 900;
        }

        .result.success {
            background:
                rgba(53,255,139,0.08);

            border: 1px solid
                rgba(53,255,139,0.2);

            color: #35ff8b;
        }

        .result.error {
            background:
                rgba(255,87,87,0.08);

            border: 1px solid
                rgba(255,87,87,0.2);

            color: #ff7777;
        }

        .result.info {
            background:
                rgba(255,255,255,0.04);

            border: 1px solid
                rgba(255,255,255,0.08);

            color:
                rgba(255,255,255,0.7);
        }

        /* =====================================================
           SCORE
        ===================================================== */

        .score-box {
            margin-top: 16px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 16px 18px;

            border-radius: 16px;

            background:
                rgba(255,255,255,0.025);

            border: 1px solid
                rgba(255,255,255,0.06);
        }

        .score-label {
            color:
                rgba(255,255,255,0.4);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 0.12em;
        }

        .score {
            font-size: 22px;

            font-weight: 950;
        }

        /* =====================================================
           HIDDEN
        ===================================================== */

        .hidden {
            display: none !important;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .page {
                padding: 12px;
            }

            .card {
                padding: 19px;
            }

            .timer {
                font-size: 58px;
            }

            h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>

<div class="page">

    <main class="shell">

        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="header">

            <div class="brand">
                SAMAGRA
            </div>

            <div
                id="status"
                class="status"
            >
                WAITING
            </div>

        </header>


        <!-- =================================================
             JOIN
        ================================================== -->

        <section
            id="joinCard"
            class="card"
        >

            <h1>
                Join the Challenge
            </h1>

            <p class="muted">
                Enter your team name.
                One phone should be used
                for each team.
            </p>

            <input
                id="teamNameInput"
                class="input"
                maxlength="30"
                autocomplete="off"
                placeholder="Enter team name"
            >

            <button
                id="joinButton"
                class="button"
            >
                JOIN GAME
            </button>

        </section>


        <!-- =================================================
             GAME
        ================================================== -->

        <section
            id="gameCard"
            class="card hidden"
        >

            <div class="game-top">

                <div>

                    <div
                        id="teamName"
                        class="team-name"
                    >
                        TEAM
                    </div>

                    <div
                        id="roundText"
                        class="round"
                    >
                        Waiting...
                    </div>

                </div>

                <div
                    id="answerState"
                    class="status"
                >
                    WAITING
                </div>

            </div>


            <!-- TIMER -->

            <div class="timer-box">

                <div class="timer-label">
                    TIME REMAINING
                </div>

                <div
                    id="timer"
                    class="timer"
                >
                    30
                </div>

            </div>


            <!-- ANSWER -->

            <input
                id="answerInput"
                class="input"
                autocomplete="off"
                autocapitalize="words"
                placeholder="Type your answer..."
                disabled
            >

            <button
                id="submitButton"
                class="button"
                disabled
            >
                SUBMIT ANSWER
            </button>


            <!-- RESULT -->

            <div
                id="result"
                class="result hidden"
            ></div>


            <!-- SCORE -->

            <div class="score-box">

                <div class="score-label">
                    YOUR SCORE
                </div>

                <div
                    id="score"
                    class="score"
                >
                    0
                </div>

            </div>

        </section>

    </main>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const joinCard =
    document.getElementById(
        "joinCard"
    );

const gameCard =
    document.getElementById(
        "gameCard"
    );

const teamNameInput =
    document.getElementById(
        "teamNameInput"
    );

const joinButton =
    document.getElementById(
        "joinButton"
    );

const teamName =
    document.getElementById(
        "teamName"
    );

const status =
    document.getElementById(
        "status"
    );

const answerState =
    document.getElementById(
        "answerState"
    );

const roundText =
    document.getElementById(
        "roundText"
    );

const timer =
    document.getElementById(
        "timer"
    );

const answerInput =
    document.getElementById(
        "answerInput"
    );

const submitButton =
    document.getElementById(
        "submitButton"
    );

const result =
    document.getElementById(
        "result"
    );

const score =
    document.getElementById(
        "score"
    );


/* =========================================================
   LOCAL STATE
========================================================= */

let teamId =
    localStorage.getItem(
        "samagraTeamId"
    );

let savedTeamName =
    localStorage.getItem(
        "samagraTeamName"
    );

let currentQuestion =
    -1;

let hasSubmitted =
    false;

let submitting =
    false;


/* =========================================================
   SHOW GAME
========================================================= */

function showGame() {

    joinCard.classList.add(
        "hidden"
    );

    gameCard.classList.remove(
        "hidden"
    );

}


/* =========================================================
   SHOW RESULT
========================================================= */

function showResult(
    message,
    type
) {

    result.textContent =
        message;

    result.className =
        "result " +
        type;

    result.classList.remove(
        "hidden"
    );

}


/* =========================================================
   SET STATUS
========================================================= */

function setStatus(
    text,
    type
) {

    status.textContent =
        text;

    status.className =
        "status";

    if (
        type
    ) {

        status.classList.add(
            type
        );

    }


    answerState.textContent =
        text;

    answerState.className =
        "status";

    if (
        type
    ) {

        answerState.classList.add(
            type
        );

    }

}


/* =========================================================
   JOIN GAME
========================================================= */

async function joinGame() {

    const name =
        teamNameInput
            .value
            .trim();


    if (
        !name
    ) {

        showResult(
            "Please enter your team name.",
            "error"
        );

        return;

    }


    joinButton.disabled =
        true;

    joinButton.textContent =
        "JOINING...";


    try {

        const response =
            await fetch(
                "/api/team/join",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            name:
                                name
                        })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                data.error ||
                "Unable to join."
            );

        }


        teamId =
            data.id;

        savedTeamName =
            data.name;


        localStorage.setItem(
            "samagraTeamId",
            teamId
        );

        localStorage.setItem(
            "samagraTeamName",
            savedTeamName
        );


        teamName.textContent =
            savedTeamName;


        showGame();


        await updateGame();


    }

    catch (
        error
    ) {

        showResult(
            error.message,
            "error"
        );

    }

    finally {

        joinButton.disabled =
            false;

        joinButton.textContent =
            "JOIN GAME";

    }

}


/* =========================================================
   UPDATE GAME
========================================================= */

async function updateGame() {

    try {

        const response =
            await fetch(
                "/api/state",
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Unable to load game state."
            );

        }


        const state =
            await response.json();


        /* =================================================
           GAME NOT STARTED
        ================================================= */

        if (
            !state.started
        ) {

            setStatus(
                "WAITING",
                null
            );

            roundText.textContent =
                "Waiting for the host to start.";

            timer.textContent =
                "30";

            timer.classList.remove(
                "urgent"
            );

            answerInput.disabled =
                true;

            submitButton.disabled =
                true;

            return;

        }


        /* =================================================
           ROUND
        ================================================= */

        roundText.textContent =
            "Question " +
            String(
                state.question
            ) +
            " / " +
            String(
                state.totalQuestions
            );


        /* =================================================
           DETECT NEW QUESTION
        ================================================= */

        if (
            currentQuestion !==
            state.question
        ) {

            currentQuestion =
                state.question;

            hasSubmitted =
                false;

            submitting =
                false;

            answerInput.value =
                "";

            result.classList.add(
                "hidden"
            );

        }


        /* =================================================
           TIMER
        ================================================= */

        const remaining =
            Math.max(
                0,
                state.remaining
            );


        const seconds =
            Math.ceil(
                remaining / 1000
            );


        timer.textContent =
            seconds;


        /* =================================================
           REVEALED
        ================================================= */

        if (
            state.revealed
        ) {

            setStatus(
                "LOCKED",
                "locked"
            );

            answerInput.disabled =
                true;

            submitButton.disabled =
                true;

            if (
                !result.textContent
            ) {

                showResult(
                    "Answer revealed. This question is closed.",
                    "info"
                );

            }

        }


        /* =================================================
           ANSWERS OPEN
        ================================================= */

        else if (
            state.submissionsOpen &&
            remaining > 0
        ) {

            setStatus(
                "ANSWERS OPEN",
                "open"
            );


            if (
                !hasSubmitted &&
                !submitting
            ) {

                answerInput.disabled =
                    false;

                submitButton.disabled =
                    false;

            }


            if (
                seconds <= 5
            ) {

                timer.classList.add(
                    "urgent"
                );

            }

            else {

                timer.classList.remove(
                    "urgent"
                );

            }

        }


        /* =================================================
           LOCKED
        ================================================= */

        else {

            setStatus(
                "LOCKED",
                "locked"
            );

            answerInput.disabled =
                true;

            submitButton.disabled =
                true;

            timer.classList.remove(
                "urgent"
            );

        }


        /* =================================================
           SCORE
        ================================================= */

        if (
            Array.isArray(
                state.leaderboard
            )
        ) {

            const me =
                state.leaderboard.find(
                    team =>
                        team.id ===
                        teamId
                );


            if (
                me
            ) {

                score.textContent =
                    me.score;

            }

        }

    }

    catch (
        error
    ) {

        console.error(
            "Game state error:",
            error
        );

        setStatus(
            "CONNECTING...",
            null
        );

    }

}


/* =========================================================
   SUBMIT ANSWER
========================================================= */

async function submitAnswer() {

    if (
        submitting ||
        hasSubmitted
    ) {

        return;

    }


    const answer =
        answerInput
            .value
            .trim();


    if (
        !answer
    ) {

        showResult(
            "Type an answer first.",
            "error"
        );

        answerInput.focus();

        return;

    }


    if (
        !teamId
    ) {

        showResult(
            "Your team session is missing. Please join again.",
            "error"
        );

        return;

    }


    submitting =
        true;

    submitButton.disabled =
        true;

    submitButton.textContent =
        "SUBMITTING...";


    try {

        const response =
            await fetch(
                "/api/team/answer",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            id:
                                teamId,

                            answer:
                                answer
                        })
                }
            );


        const data =
            await response.json();


        /* =================================================
           SERVER REJECTED
        ================================================= */

        if (
            !response.ok
        ) {

            if (
                response.status ===
                400 &&
                data.error &&
                data.error
                    .toLowerCase()
                    .includes(
                        "time is up"
                    )
            ) {

                setStatus(
                    "LOCKED",
                    "locked"
                );

                answerInput.disabled =
                    true;

                submitButton.disabled =
                    true;

                showResult(
                    "Time is up. Answers are closed.",
                    "error"
                );

            }

            else {

                showResult(
                    data.error ||
                    "Unable to submit answer.",
                    "error"
                );

            }

            return;

        }


        /* =================================================
           SUCCESS
        ================================================= */

        hasSubmitted =
            true;


        answerInput.disabled =
            true;

        submitButton.disabled =
            true;


        if (
            data.correct
        ) {

            showResult(
                "✓ Correct! +" +
                data.points +
                " points",
                "success"
            );

        }

        else {

            showResult(
                "✕ Incorrect — 0 points",
                "error"
            );

        }


        score.textContent =
            data.score;


        setStatus(
            "SUBMITTED",
            "open"
        );


    }

    catch (
        error
    ) {

        console.error(
            "Submit error:",
            error
        );

        showResult(
            "Network error. Please try again.",
            "error"
        );

    }

    finally {

        submitting =
            false;

        submitButton.textContent =
            "SUBMIT ANSWER";


        if (
            !hasSubmitted
        ) {

            submitButton.disabled =
                false;

        }

    }

}


/* =========================================================
   ENTER KEY
========================================================= */

answerInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            submitAnswer();

        }

    }
);


/* =========================================================
   BUTTONS
========================================================= */

joinButton.addEventListener(
    "click",
    joinGame
);

submitButton.addEventListener(
    "click",
    submitAnswer
);


/* =========================================================
   RESTORE TEAM SESSION
========================================================= */

if (
    teamId &&
    savedTeamName
) {

    teamName.textContent =
        savedTeamName;

    showGame();

}


/* =========================================================
   INITIAL STATE
========================================================= */

updateGame();


/* =========================================================
   LIVE UPDATE

   250ms keeps the countdown visually accurate.
========================================================= */

setInterval(
    updateGame,
    250
);

</script>

</body>
</html>
