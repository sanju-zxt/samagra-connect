<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SAMAGRA CONNECT • Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    #171a20 0%,
                    #080a0d 42%,
                    #030405 100%
                );

            color: #f5f6f8;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;
        }

        button {
            font-family: inherit;
        }

        .page {
            width: min(
                1500px,
                100%
            );

            min-height: 100vh;

            margin: auto;

            padding: 24px;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding: 20px 24px;

            border-radius: 22px;

            border: 1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.035);

            backdrop-filter:
                blur(20px);

            box-shadow:
                0 25px 80px
                rgba(0,0,0,0.3);
        }

        .brand {
            display: flex;

            align-items: center;

            gap: 14px;
        }

        .brand-mark {
            width: 48px;
            height: 48px;

            display: grid;
            place-items: center;

            border-radius: 15px;

            background: white;

            color: #050608;

            font-size: 23px;

            font-weight: 950;
        }

        .brand-name {
            font-size: 20px;

            font-weight: 950;

            letter-spacing:
                0.14em;
        }

        .brand-subtitle {
            margin-top: 3px;

            color:
                rgba(255,255,255,0.38);

            font-size: 10px;

            font-weight: 800;

            letter-spacing:
                0.25em;
        }

        .connection {
            display: flex;

            align-items: center;

            gap: 9px;

            padding: 10px 15px;

            border-radius: 999px;

            border: 1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.025);

            font-size: 11px;

            font-weight: 900;

            letter-spacing:
                0.1em;
        }

        .connection-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #ff5757;
        }

        .connection.online
        .connection-dot {
            background: #35ff8b;

            box-shadow:
                0 0 15px
                rgba(53,255,139,0.7);
        }

        /* =====================================================
           GRID
        ===================================================== */

        .grid {
            display: grid;

            grid-template-columns:
                minmax(0, 1.4fr)
                minmax(330px, 0.6fr);

            gap: 18px;

            margin-top: 18px;
        }

        /* =====================================================
           CARD
        ===================================================== */

        .card {
            padding: 24px;

            border-radius: 22px;

            border: 1px solid
                rgba(255,255,255,0.075);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.018)
                );

            box-shadow:
                0 25px 80px
                rgba(0,0,0,0.28);

            backdrop-filter:
                blur(18px);
        }

        .card-title {
            font-size: 17px;

            font-weight: 900;
        }

        .card-subtitle {
            margin-top: 6px;

            color:
                rgba(255,255,255,0.42);

            font-size: 12px;

            line-height: 1.5;
        }

        /* =====================================================
           GAME STATUS
        ===================================================== */

        .status-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-top: 20px;
        }

        .stat {
            padding: 17px;

            border-radius: 16px;

            border: 1px solid
                rgba(255,255,255,0.06);

            background:
                rgba(255,255,255,0.025);
        }

        .stat-label {
            color:
                rgba(255,255,255,0.38);

            font-size: 9px;

            font-weight: 900;

            letter-spacing:
                0.16em;
        }

        .stat-value {
            margin-top: 7px;

            font-size: 25px;

            font-weight: 950;

            font-variant-numeric:
                tabular-nums;
        }

        /* =====================================================
           TIMER
        ===================================================== */

        .timer-panel {
            margin-top: 16px;

            padding: 24px;

            text-align: center;

            border-radius: 20px;

            border: 1px solid
                rgba(255,255,255,0.07);

            background:
                rgba(0,0,0,0.22);
        }

        .timer-label {
            color:
                rgba(255,255,255,0.4);

            font-size: 10px;

            font-weight: 900;

            letter-spacing:
                0.2em;
        }

        .timer {
            margin-top: 8px;

            font-size: 70px;

            line-height: 1;

            font-weight: 950;

            font-variant-numeric:
                tabular-nums;
        }

        .timer.danger {
            color: #ff5757;

            text-shadow:
                0 0 25px
                rgba(255,87,87,0.5);
        }

        /* =====================================================
           BUTTONS
        ===================================================== */

        .actions {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-top: 18px;
        }

        .button {
            min-height: 52px;

            padding: 13px 18px;

            border-radius: 14px;

            border: 1px solid
                rgba(255,255,255,0.12);

            background:
                rgba(255,255,255,0.045);

            color: #f5f6f8;

            font-size: 11px;

            font-weight: 900;

            letter-spacing:
                0.09em;

            cursor: pointer;

            transition:
                transform .18s ease,
                background .18s ease,
                opacity .18s ease;
        }

        .button:hover:not(:disabled) {
            transform:
                translateY(-2px);

            background:
                rgba(255,255,255,0.09);
        }

        .button:active:not(:disabled) {
            transform:
                translateY(0);
        }

        .button.primary {
            background: white;

            color: #050608;

            border-color: white;
        }

        .button.danger {
            color: #ff7777;

            border-color:
                rgba(255,87,87,0.25);

            background:
                rgba(255,87,87,0.07);
        }

        .button:disabled {
            opacity: .28;

            cursor: not-allowed;

            transform: none;
        }

        /* =====================================================
           QUESTION
        ===================================================== */

        .question-box {
            margin-top: 18px;

            padding: 20px;

            border-radius: 18px;

            border: 1px solid
                rgba(255,255,255,0.07);

            background:
                rgba(255,255,255,0.025);
        }

        .question-number {
            color:
                rgba(255,255,255,0.4);

            font-size: 10px;

            font-weight: 900;

            letter-spacing:
                0.18em;
        }

        .question-answer {
            margin-top: 8px;

            font-size: 25px;

            font-weight: 950;

            letter-spacing:
                .02em;
        }

        .answer-hidden {
            color:
                rgba(255,255,255,0.22);
        }

        /* =====================================================
           LEADERBOARD
        ===================================================== */

        .leaderboard {
            width: 100%;

            border-collapse:
                separate;

            border-spacing:
                0 6px;

            margin-top: 14px;
        }

        .leaderboard th {
            padding: 7px 9px;

            text-align: left;

            color:
                rgba(255,255,255,0.32);

            font-size: 8px;

            font-weight: 900;

            letter-spacing:
                0.15em;
        }

        .leaderboard td {
            padding: 13px 9px;

            background:
                rgba(255,255,255,0.025);

            border-top: 1px solid
                rgba(255,255,255,0.035);

            border-bottom: 1px solid
                rgba(255,255,255,0.035);

            font-size: 11px;

            font-weight: 700;
        }

        .leaderboard td:first-child {
            border-radius:
                10px 0 0 10px;

            width: 45px;

            color:
                rgba(255,255,255,0.4);
        }

        .leaderboard td:last-child {
            border-radius:
                0 10px 10px 0;

            text-align: right;

            font-weight: 950;
        }

        .leaderboard .top-rank td {
            background:
                rgba(255,255,255,0.07);
        }

        .empty {
            padding: 35px 10px;

            text-align: center;

            color:
                rgba(255,255,255,0.3);

            font-size: 12px;
        }

        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {
            margin-top: 16px;

            padding: 14px 16px;

            border-radius: 13px;

            border: 1px solid
                rgba(255,255,255,0.07);

            background:
                rgba(255,255,255,0.025);

            color:
                rgba(255,255,255,0.55);

            font-size: 12px;

            font-weight: 700;
        }

        .message.success {
            color: #35ff8b;

            border-color:
                rgba(53,255,139,0.2);

            background:
                rgba(53,255,139,0.06);
        }

        .message.error {
            color: #ff7777;

            border-color:
                rgba(255,87,87,0.2);

            background:
                rgba(255,87,87,0.06);
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 900px) {

            .grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            .page {
                padding: 12px;
            }

            .header {
                padding: 16px;
            }

            .brand-name {
                font-size: 16px;
            }

            .status-grid {
                grid-template-columns:
                    1fr 1fr;
            }

            .actions {
                grid-template-columns:
                    1fr;
            }

            .timer {
                font-size: 58px;
            }

            .card {
                padding: 18px;
            }

        }

    </style>

</head>


<body>

<div class="page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="brand">

            <div class="brand-mark">
                S
            </div>

            <div>

                <div class="brand-name">
                    SAMAGRA
                </div>

                <div class="brand-subtitle">
                    CONNECT • ADMIN CONTROL
                </div>

            </div>

        </div>


        <div
            id="connection"
            class="connection"
        >

            <span
                class="connection-dot"
            ></span>

            <span id="connectionText">
                CONNECTING
            </span>

        </div>

    </header>


    <!-- =====================================================
         MAIN GRID
    ====================================================== -->

    <main class="grid">


        <!-- =================================================
             LEFT
        ================================================== -->

        <section class="card">

            <div class="card-title">
                Game Control
            </div>

            <div class="card-subtitle">
                Control the live logo challenge.
            </div>


            <!-- STATUS -->

            <div class="status-grid">

                <div class="stat">

                    <div class="stat-label">
                        STATUS
                    </div>

                    <div
                        id="gameStatus"
                        class="stat-value"
                    >
                        WAITING
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        QUESTION
                    </div>

                    <div
                        id="questionNumber"
                        class="stat-value"
                    >
                        0 / 19
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        PLAYERS
                    </div>

                    <div
                        id="playerCount"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>

            </div>


            <!-- TIMER -->

            <div class="timer-panel">

                <div class="timer-label">
                    TIME REMAINING
                </div>

                <div
                    id="timer"
                    class="timer"
                >
                    30
                </div>

            </div>


            <!-- CONTROLS -->

            <div class="actions">

                <button
                    id="startButton"
                    class="button primary"
                >
                    START GAME
                </button>


                <button
                    id="restartButton"
                    class="button"
                    disabled
                >
                    RESTART ROUND
                </button>


                <button
                    id="revealButton"
                    class="button"
                    disabled
                >
                    REVEAL ANSWER
                </button>


                <button
                    id="nextButton"
                    class="button"
                    disabled
                >
                    NEXT QUESTION
                </button>


                <button
                    id="resetButton"
                    class="button danger"
                >
                    RESET GAME
                </button>


                <button
                    id="stopButton"
                    class="button danger"
                    disabled
                >
                    STOP GAME
                </button>

            </div>


            <!-- QUESTION -->

            <div class="question-box">

                <div class="question-number">
                    CURRENT ANSWER
                </div>

                <div
                    id="currentAnswer"
                    class="question-answer answer-hidden"
                >
                    HIDDEN
                </div>

            </div>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            >
                Waiting for game server...
            </div>

        </section>


        <!-- =================================================
             RIGHT
        ================================================== -->

        <section class="card">

            <div class="card-title">
                Live Leaderboard
            </div>

            <div class="card-subtitle">
                Scores update automatically.
            </div>


            <table class="leaderboard">

                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            PLAYER
                        </th>

                        <th>
                            STATUS
                        </th>

                        <th>
                            SCORE
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="leaderboardBody"
                >

                    <tr>

                        <td
                            colspan="4"
                            class="empty"
                        >
                            No players yet.
                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const connection =
    document.getElementById(
        "connection"
    );

const connectionText =
    document.getElementById(
        "connectionText"
    );

const gameStatus =
    document.getElementById(
        "gameStatus"
    );

const questionNumber =
    document.getElementById(
        "questionNumber"
    );

const playerCount =
    document.getElementById(
        "playerCount"
    );

const timer =
    document.getElementById(
        "timer"
    );

const currentAnswer =
    document.getElementById(
        "currentAnswer"
    );

const message =
    document.getElementById(
        "message"
    );

const leaderboardBody =
    document.getElementById(
        "leaderboardBody"
    );


const startButton =
    document.getElementById(
        "startButton"
    );

const restartButton =
    document.getElementById(
        "restartButton"
    );

const revealButton =
    document.getElementById(
        "revealButton"
    );

const nextButton =
    document.getElementById(
        "nextButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const stopButton =
    document.getElementById(
        "stopButton"
    );


/* =========================================================
   HELPERS
========================================================= */

function showMessage(
    text,
    type = ""
) {

    message.textContent =
        text;

    message.className =
        "message";

    if (type) {

        message.classList.add(
            type
        );

    }

}


function setConnected(
    connected
) {

    if (connected) {

        connection.classList.add(
            "online"
        );

        connectionText.textContent =
            "CONNECTED";

    }

    else {

        connection.classList.remove(
            "online"
        );

        connectionText.textContent =
            "OFFLINE";

    }

}


/* =========================================================
   API REQUEST
========================================================= */

async function api(
    url,
    options = {}
) {

    const response =
        await fetch(
            url,
            {
                ...options,

                headers: {
                    "Content-Type":
                        "application/json",

                    ...(options.headers ||
                        {})
                }
            }
        );


    let data;

    const contentType =
        response.headers
            .get(
                "content-type"
            ) || "";


    if (
        contentType.includes(
            "application/json"
        )
    ) {

        data =
            await response.json();

    }

    else {

        const text =
            await response.text();

        throw new Error(
            `Server returned non-JSON response (${response.status}): ${text.slice(0, 120)}`
        );

    }


    if (
        !response.ok
    ) {

        throw new Error(
            data.error ||
            `Request failed (${response.status})`
        );

    }


    return data;

}


/* =========================================================
   UPDATE UI FROM STATE
========================================================= */

function updateUI(
    state
) {

    setConnected(
        true
    );


    const started =
        Boolean(
            state.started
        );


    gameStatus.textContent =
        started
            ? "LIVE"
            : "WAITING";


    const question =
        state.question || 0;


    questionNumber.textContent =
        `${question} / ${state.totalQuestions || 19}`;


    playerCount.textContent =
        state.playerCount ??
        (
            Array.isArray(
                state.leaderboard
            )
                ? state.leaderboard.length
                : 0
        );


    const remaining =
        Math.max(
            0,
            Number(
                state.remaining || 0
            )
        );


    const seconds =
        Math.ceil(
            remaining / 1000
        );


    timer.textContent =
        started
            ? seconds
            : 30;


    if (
        started &&
        seconds <= 5
    ) {

        timer.classList.add(
            "danger"
        );

    }

    else {

        timer.classList.remove(
            "danger"
        );

    }


    /* =====================================================
       ANSWER
    ===================================================== */

    if (
        state.revealed &&
        state.answer
    ) {

        currentAnswer.textContent =
            state.answer;

        currentAnswer.classList.remove(
            "answer-hidden"
        );

    }

    else {

        currentAnswer.textContent =
            "HIDDEN";

        currentAnswer.classList.add(
            "answer-hidden"
        );

    }


    /* =====================================================
       BUTTONS
    ===================================================== */

    startButton.disabled =
        started;

    restartButton.disabled =
        !started;

    revealButton.disabled =
        !started ||
        Boolean(
            state.revealed
        );

    nextButton.disabled =
        !started;

    stopButton.disabled =
        !started;


    /* =====================================================
       MESSAGE
    ===================================================== */

    if (
        started &&
        state.revealed
    ) {

        showMessage(
            "Answer revealed.",
            "success"
        );

    }

    else if (
        started &&
        state.submissionsOpen
    ) {

        showMessage(
            "Question is live. Students can submit answers.",
            "success"
        );

    }

    else if (
        started
    ) {

        showMessage(
            "Question is locked.",
            ""
        );

    }

    else {

        showMessage(
            "Ready to start the game.",
            ""
        );

    }


    /* =====================================================
       LEADERBOARD
    ===================================================== */

    renderLeaderboard(
        state.leaderboard ||
        []
    );

}


/* =========================================================
   LEADERBOARD
========================================================= */

function renderLeaderboard(
    players
) {

    if (
        !players.length
    ) {

        leaderboardBody.innerHTML = `
            <tr>
                <td
                    colspan="4"
                    class="empty"
                >
                    No players yet.
                </td>
            </tr>
        `;

        return;

    }


    leaderboardBody.innerHTML =
        players
            .map(
                (
                    player,
                    index
                ) => {

                    const rank =
                        player.rank ||
                        index + 1;


                    return `
                        <tr
                            class="${
                                rank === 1
                                    ? "top-rank"
                                    : ""
                            }"
                        >

                            <td>
                                ${rank}
                            </td>

                            <td>
                                ${escapeHtml(
                                    player.name
                                )}
                            </td>

                            <td>
                                ${
                                    player.status ||
                                    (
                                        player.correct
                                            ? "CORRECT"
                                            : "PLAYING"
                                    )
                                }
                            </td>

                            <td>
                                ${Number(
                                    player.score || 0
                                ).toFixed(2)}
                            </td>

                        </tr>
                    `;

                }
            )
            .join("");

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   LOAD STATE
========================================================= */

async function loadState() {

    try {

        const state =
            await api(
                "/api/state"
            );

        updateUI(
            state
        );

    }

    catch (
        error
    ) {

        console.error(
            error
        );

        setConnected(
            false
        );

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =========================================================
   START GAME
========================================================= */

async function startGame() {

    startButton.disabled =
        true;

    startButton.textContent =
        "STARTING...";


    try {

        const data =
            await api(
                "/api/admin/start",
                {
                    method:
                        "POST"
                }
            );


        updateUI(
            data.state
        );


        showMessage(
            "Game started successfully.",
            "success"
        );

    }

    catch (
        error
    ) {

        console.error(
            "START ERROR:",
            error
        );

        showMessage(
            error.message,
            "error"
        );

        await loadState();

    }

    finally {

        startButton.textContent =
            "START GAME";

    }

}


/* =========================================================
   RESTART
========================================================= */

async function restartGame() {

    try {

        const data =
            await api(
                "/api/admin/restart",
                {
                    method:
                        "POST"
                }
            );

        updateUI(
            data.state
        );

        showMessage(
            "Current round restarted.",
            "success"
        );

    }

    catch (
        error
    ) {

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =========================================================
   REVEAL
========================================================= */

async function revealAnswer() {

    try {

        const data =
            await api(
                "/api/admin/reveal",
                {
                    method:
                        "POST"
                }
            );


        updateUI(
            data.state
        );


        showMessage(
            `Answer revealed: ${data.answer}`,
            "success"
        );

    }

    catch (
        error
    ) {

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =========================================================
   NEXT
========================================================= */

async function nextQuestion() {

    try {

        const data =
            await api(
                "/api/admin/next",
                {
                    method:
                        "POST"
                }
            );


        updateUI(
            data.state
        );


        if (
            data.finished
        ) {

            showMessage(
                "All questions completed.",
                "success"
            );

        }

        else {

            showMessage(
                "Next question started.",
                "success"
            );

        }

    }

    catch (
        error
    ) {

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =========================================================
   RESET
========================================================= */

async function resetGame() {

    const confirmed =
        confirm(
            "Reset the game? Scores will be cleared."
        );


    if (
        !confirmed
    ) {

        return;

    }


    try {

        const data =
            await api(
                "/api/admin/reset",
                {
                    method:
                        "POST"
                }
            );


        updateUI(
            data.state
        );


        showMessage(
            "Game reset.",
            "success"
        );

    }

    catch (
        error
    ) {

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =========================================================
   STOP
========================================================= */

async function stopGame() {

    const confirmed =
        confirm(
            "Stop the current game?"
        );


    if (
        !confirmed
    ) {

        return;

    }


    try {

        const data =
            await api(
                "/api/admin/stop",
                {
                    method:
                        "POST"
                }
            );


        updateUI(
            data.state
        );


        showMessage(
            "Game stopped.",
            "success"
        );

    }

    catch (
        error
    ) {

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =========================================================
   EVENTS
========================================================= */

startButton.addEventListener(
    "click",
    startGame
);

restartButton.addEventListener(
    "click",
    restartGame
);

revealButton.addEventListener(
    "click",
    revealAnswer
);

nextButton.addEventListener(
    "click",
    nextQuestion
);

resetButton.addEventListener(
    "click",
    resetGame
);

stopButton.addEventListener(
    "click",
    stopGame
);


/* =========================================================
   INITIALIZE
========================================================= */

loadState();


/* =========================================================
   LIVE STATE
========================================================= */

setInterval(
    loadState,
    250
);

</script>
