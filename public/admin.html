<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Samagra Connect • Admin</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body class="admin-page">

<div class="admin-shell">


    <!-- HEADER -->

    <header class="admin-header">

        <div>

            <div class="eyebrow">
                SAMAGRA CONNECT
            </div>

            <h1>
                Game Control
            </h1>

            <p>
                Individual Logo Challenge
            </p>

        </div>


        <div
            id="adminStatus"
            class="admin-status"
        >
            READY
        </div>

    </header>


    <!-- STATS -->

    <section class="admin-stats">

        <div class="admin-stat">

            <span>
                QUESTION
            </span>

            <strong
                id="questionStat"
            >
                —
            </strong>

        </div>


        <div class="admin-stat">

            <span>
                TIME
            </span>

            <strong
                id="timeStat"
            >
                30
            </strong>

        </div>


        <div class="admin-stat">

            <span>
                PLAYERS
            </span>

            <strong
                id="playersStat"
            >
                0
            </strong>

        </div>


        <div class="admin-stat">

            <span>
                MAX
            </span>

            <strong>
                10
            </strong>

        </div>

    </section>


    <!-- CONTROLS -->

    <section class="admin-panel">

        <div class="panel-title">
            HOST CONTROL
        </div>

        <div class="admin-buttons">

            <button
                id="startButton"
                class="admin-button primary"
            >
                START GAME
            </button>

            <button
                id="nextButton"
                class="admin-button"
            >
                NEXT QUESTION
            </button>

            <button
                id="revealButton"
                class="admin-button"
            >
                REVEAL ANSWER
            </button>

            <button
                id="resetButton"
                class="admin-button"
            >
                RESET
            </button>

            <button
                id="stopButton"
                class="admin-button danger"
            >
                STOP GAME
            </button>

        </div>

    </section>


    <!-- CURRENT -->

    <section class="admin-grid">


        <div class="admin-panel">

            <div class="panel-title">
                CURRENT QUESTION
            </div>


            <div
                id="currentQuestion"
                class="current-question"
            >
                WAITING
            </div>


            <div class="admin-answer-box">

                <div class="panel-small">
                    ANSWER
                </div>

                <div
                    id="currentAnswer"
                    class="admin-answer hidden"
                >
                    —
                </div>

                <div
                    id="answerHidden"
                    class="answer-hidden"
                >
                    HIDDEN
                </div>

            </div>

        </div>


        <!-- LEADERBOARD -->

        <div class="admin-panel">

            <div class="panel-heading-row">

                <div class="panel-title">
                    LIVE LEADERBOARD
                </div>

                <div
                    id="leaderboardCount"
                    class="mini-pill"
                >
                    0 PLAYERS
                </div>

            </div>


            <div
                id="leaderboard"
                class="admin-leaderboard"
            >

                <div class="empty-board">
                    No players yet.
                </div>

            </div>

        </div>

    </section>


    <!-- ACTIVITY -->

    <section class="admin-panel">

        <div class="panel-title">
            SYSTEM
        </div>

        <div
            id="systemMessage"
            class="system-message"
        >
            Waiting for game start.
        </div>

    </section>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();


const startButton =
    document.getElementById(
        "startButton"
    );

const nextButton =
    document.getElementById(
        "nextButton"
    );

const revealButton =
    document.getElementById(
        "revealButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const stopButton =
    document.getElementById(
        "stopButton"
    );

const questionStat =
    document.getElementById(
        "questionStat"
    );

const timeStat =
    document.getElementById(
        "timeStat"
    );

const playersStat =
    document.getElementById(
        "playersStat"
    );

const adminStatus =
    document.getElementById(
        "adminStatus"
    );

const currentQuestion =
    document.getElementById(
        "currentQuestion"
    );

const currentAnswer =
    document.getElementById(
        "currentAnswer"
    );

const answerHidden =
    document.getElementById(
        "answerHidden"
    );

const leaderboard =
    document.getElementById(
        "leaderboard"
    );

const leaderboardCount =
    document.getElementById(
        "leaderboardCount"
    );

const systemMessage =
    document.getElementById(
        "systemMessage"
    );


/* =========================================================
   API HELPER
========================================================= */

async function adminAction(
    endpoint
) {

    try {

        const response =
            await fetch(
                endpoint,
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    }
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Action failed."
            );
        }

        if (data.answer) {

            currentAnswer.textContent =
                data.answer;

            currentAnswer.classList.remove(
                "hidden"
            );

            answerHidden.classList.add(
                "hidden"
            );
        }

        return data;

    } catch (error) {

        systemMessage.textContent =
            error.message;

        throw error;
    }
}


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
    "click",
    async () => {

        await adminAction(
            "/api/admin/start"
        );

        systemMessage.textContent =
            "Game started.";

    }
);


/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(
    "click",
    async () => {

        const data =
            await adminAction(
                "/api/admin/next"
            );

        if (data.finished) {

            systemMessage.textContent =
                "Game finished.";

        } else {

            systemMessage.textContent =
                "Next question started.";
        }

    }
);


/* =========================================================
   REVEAL
========================================================= */

revealButton.addEventListener(
    "click",
    async () => {

        const data =
            await adminAction(
                "/api/admin/reveal"
            );

        currentAnswer.textContent =
            data.answer;

        currentAnswer.classList.remove(
            "hidden"
        );

        answerHidden.classList.add(
            "hidden"
        );

        systemMessage.textContent =
            "Answer revealed.";

    }
);


/* =========================================================
   RESET
========================================================= */

resetButton.addEventListener(
    "click",
    async () => {

        const confirmed =
            confirm(
                "Reset the entire game and all scores?"
            );

        if (!confirmed) {
            return;
        }

        await adminAction(
            "/api/admin/reset"
        );

        currentAnswer.textContent =
            "—";

        currentAnswer.classList.add(
            "hidden"
        );

        answerHidden.classList.remove(
            "hidden"
        );

        systemMessage.textContent =
            "Game reset.";

    }
);


/* =========================================================
   STOP
========================================================= */

stopButton.addEventListener(
    "click",
    async () => {

        await adminAction(
            "/api/admin/stop"
        );

        systemMessage.textContent =
            "Game stopped.";

    }
);


/* =========================================================
   GAME STATE
========================================================= */

socket.on(
    "game-state",
    state => {

        playersStat.textContent =
            state.players.length;


        if (
            state.questionIndex >= 0 &&
            state.question
        ) {

            questionStat.textContent =
                `${state.questionIndex + 1} / ${state.question.total}`;

            currentQuestion.textContent =
                `QUESTION ${String(
                    state.questionIndex + 1
                ).padStart(2, "0")}`;

        } else {

            questionStat.textContent =
                "—";

            currentQuestion.textContent =
                "WAITING";
        }


        if (!state.running) {

            adminStatus.textContent =
                state.stopped
                    ? "STOPPED"
                    : "READY";

        } else if (state.locked) {

            adminStatus.textContent =
                state.revealed
                    ? "ANSWER REVEALED"
                    : "LOCKED";

        } else {

            adminStatus.textContent =
                "LIVE";
        }


        if (state.revealed) {

            currentAnswer.classList.remove(
                "hidden"
            );

            answerHidden.classList.add(
                "hidden"
            );

        } else {

            currentAnswer.classList.add(
                "hidden"
            );

            answerHidden.classList.remove(
                "hidden"
            );

        }

    }
);


/* =========================================================
   TIMER
========================================================= */

socket.on(
    "timer",
    data => {

        timeStat.textContent =
            Math.ceil(
                Math.max(
                    0,
                    data.remaining
                )
            );

    }
);


/* =========================================================
   LEADERBOARD
========================================================= */

socket.on(
    "leaderboard",
    list => {

        playersStat.textContent =
            list.length;

        leaderboardCount.textContent =
            `${list.length} ${
                list.length === 1
                    ? "PLAYER"
                    : "PLAYERS"
            }`;


        if (!list.length) {

            leaderboard.innerHTML = `
                <div class="empty-board">
                    No players yet.
                </div>
            `;

            return;
        }


        leaderboard.innerHTML =
            list
                .map(
                    player => `
                    <div class="admin-player-row">

                        <div class="player-rank">
                            ${player.rank}
                        </div>

                        <div class="player-name">
                            ${escapeHtml(
                                player.name
                            )}
                        </div>

                        <div class="player-connection ${
                            player.connected
                                ? "online"
                                : "offline"
                        }">
                            ${
                                player.connected
                                    ? "ONLINE"
                                    : "OFFLINE"
                            }
                        </div>

                        <div class="player-score">
                            ${player.score}
                        </div>

                    </div>
                    `
                )
                .join("");

    }
);


/* =========================================================
   EVENTS
========================================================= */

socket.on(
    "game-started",
    () => {

        systemMessage.textContent =
            "Game started.";

    }
);


socket.on(
    "new-question",
    () => {

        currentAnswer.classList.add(
            "hidden"
        );

        answerHidden.classList.remove(
            "hidden"
        );

        systemMessage.textContent =
            "New question is live.";

    }
);


socket.on(
    "answer-revealed",
    data => {

        currentAnswer.textContent =
            data.answer;

        currentAnswer.classList.remove(
            "hidden"
        );

        answerHidden.classList.add(
            "hidden"
        );

    }
);


socket.on(
    "round-ended",
    () => {

        systemMessage.textContent =
            "Time is up.";

    }
);


socket.on(
    "game-finished",
    () => {

        systemMessage.textContent =
            "All 19 questions completed.";

        adminStatus.textContent =
            "FINISHED";

    }
);


socket.on(
    "game-stopped",
    () => {

        systemMessage.textContent =
            "Game stopped.";

    }
);


socket.on(
    "game-reset",
    () => {

        systemMessage.textContent =
            "Game reset.";

        currentQuestion.textContent =
            "WAITING";

        currentAnswer.textContent =
            "—";

        currentAnswer.classList.add(
            "hidden"
        );

        answerHidden.classList.remove(
            "hidden"
        );

    }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
